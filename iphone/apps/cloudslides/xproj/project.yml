name: CloudSlides
options:
  bundleIdPrefix: com.iosworld.benchmark
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    MARKETING_VERSION: 1.0
    CURRENT_PROJECT_VERSION: 1
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_ALLOWED: YES
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
    SWIFT_VERSION: 5.0
    TARGETED_DEVICE_FAMILY: 1
    INFOPLIST_FILE: CloudSlides/Info.plist
    PRODUCT_BUNDLE_IDENTIFIER: com.iosworld.benchmark.cloudslides
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    CODE_SIGN_ENTITLEMENTS: CloudSlides/CloudSlides.entitlements

targets:
  CloudSlides:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: CloudSlides
        excludes:
          - Info.plist
    resources:
      - path: CloudSlides/Resources
      - path: CloudSlides/Assets.xcassets
    settings:
      base:
        PRODUCT_NAME: CloudSlides
