name: SplitPay
options:
  bundleIdPrefix: com.iosworld.benchmark
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
    SWIFT_VERSION: 5.0
    TARGETED_DEVICE_FAMILY: 1
    INFOPLIST_FILE: SplitPay/Info.plist
    PRODUCT_BUNDLE_IDENTIFIER: com.iosworld.benchmark.splitpay
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

targets:
  SplitPay:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SplitPay
        excludes:
          - Info.plist
    resources:
      - path: SplitPay/Resources
        excludes:
          - LaunchScreen.storyboard
          - README_RULEBOOK.txt
    settings:
      base:
        PRODUCT_NAME: SplitPay
